name: LAN fleet checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lan-fleet-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Routine LAN releases build locally. This inherited CI job is not a release gate.
    if: ${{ false }}
    runs-on: [self-hosted, windows, x64, t3-lan-anvil]
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.t3/test-browsers
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 64
      - uses: ./.github/actions/setup-ci-deps
      - name: Select release validation profile
        id: profile
        shell: bash
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          node scripts/lan/release-profile.ts scripts/lan/qualification-baseline.json "$RUNNER_TEMP/lan-release-profile.json"
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; const r=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,"lan-release-profile.json"),"utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT,"profile="+r.profile+"\nneeds_browser="+r.needsBrowser+"\n"); fs.writeFileSync(path.join(process.env.RUNNER_TEMP,"lan-release-tests.txt"),r.tests.join("\n")+(r.tests.length?"\n":""));'
      - name: Typecheck affected applications and contracts
        shell: bash
        run: vp run --filter ./apps/server --filter @t3tools/web --filter @t3tools/desktop --filter @t3tools/contracts --filter @t3tools/client-runtime --filter @t3tools/scripts typecheck
      - name: Install workspace-local Chromium test runtime
        if: steps.profile.outputs.needs_browser == 'true'
        shell: bash
        run: node apps/web/node_modules/playwright/cli.js install chromium --only-shell
      - name: Verify mandatory and changed release tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lan-release-tests"
          mapfile -t tests < "$RUNNER_TEMP/lan-release-tests.txt"
          vp test run "${tests[@]}" --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/lan-release-tests/vitest.json"
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; import {execFileSync} from "node:child_process"; import {releaseTestMetadata} from "./scripts/lan/release-profile.ts"; const dir=path.join(process.env.RUNNER_TEMP,"lan-release-tests"); const files=fs.readFileSync(path.join(process.env.RUNNER_TEMP,"lan-release-tests.txt"),"utf8").split(/\r?\n/).filter(Boolean); const commit=execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(); if(commit!==process.env.GITHUB_SHA) throw new Error("CI source does not match event commit"); const report=JSON.parse(fs.readFileSync(path.join(dir,"vitest.json"),"utf8")); fs.writeFileSync(path.join(dir,"metadata.json"),JSON.stringify(releaseTestMetadata(process.cwd(),commit,files,report),null,2)+"\n");'
      - name: Upload release test evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lan-release-tests
          path: ${{ runner.temp }}/lan-release-tests/
          if-no-files-found: error
      - name: Verify client version and encrypted setup UI
        if: steps.profile.outputs.profile == 'qualification'
        shell: bash
        run: >-
          vp test run
          apps/web/src/components/sidebar/SidebarBrandMark.browser.test.tsx
          apps/web/src/components/settings/LanFleetSetup.browser.test.tsx
          apps/web/src/components/settings/LanFleetPrimary.browser.test.tsx
          apps/web/src/connection/lanFleetEnvironment.test.ts
      - name: Verify native Windows packaging and manifest restoration
        if: steps.profile.outputs.profile == 'qualification'
        shell: bash
        run: >-
          vp test run scripts/build-desktop-artifact.test.ts
          -t 'native raw staging|Cursor SDK|target Windows natives|overlapping builds|resolved version|restore failure'
      - name: Verify build reuse, native bootstrap and both MCP access paths
        if: steps.profile.outputs.profile == 'qualification'
        shell: bash
        run: >-
          vp test run
          scripts/lan/stage-locks.test.ts
          scripts/lan/accept-stage-locks.test.ts
          scripts/lan/source-git.test.ts
          scripts/lan/windows-native-build.test.ts
          scripts/lan/native-dependency-cache.test.ts
          scripts/lan/native-resource-cache.test.ts
          scripts/lan/release-pipeline.test.ts
          scripts/lan/release-runner.test.ts
          scripts/lan/release-git-pins.test.ts
          scripts/lan/electron-cache.test.ts
          scripts/lan/windows-build-execution.test.ts
          scripts/lan/windows-build-preparation.test.ts
          scripts/lib/check-inputs.test.ts
          scripts/lib/changed-tests.test.ts
          scripts/lan/runtime-policy.test.ts
          apps/desktop/src/backend/DesktopBackendManager.test.ts
          apps/desktop/src/backend/DesktopBackendConfiguration.test.ts
          apps/server/src/launcherWatch.test.ts
          apps/server/src/cli/config.test.ts
          apps/server/src/mcp/McpToolAccess.test.ts
          apps/server/src/lan/EnvironmentRouting.test.ts
          apps/server/src/lan/NativeTaskService.test.ts
          apps/server/src/lan/RemoteTaskTransport.test.ts
      - name: Verify execution intake is fenced before persistence
        shell: bash
        run: vp test run apps/server/src/orchestration-v2/runtimeLayer.test.ts apps/server/src/scheduledTasks/ScheduledTaskService.webhook.test.ts -t 'native update admission'
      - name: Verify synthetic enrollment, delivery, polling, and retained-home behavior
        if: steps.profile.outputs.profile == 'qualification'
        shell: bash
        run: >-
          vp test run
          apps/server/src/lan/FleetBootstrap.test.ts
          apps/server/src/lan/FleetDelivery.test.ts
          apps/server/src/lan/FleetFiles.test.ts
          apps/server/src/lan/FleetEnrollment.test.ts
          apps/server/src/lan/FleetVault.test.ts
          apps/server/src/lan/FleetTransport.test.ts
          apps/desktop/src/lan/DesktopFleetGateway.test.ts
          packages/shared/src/fleetTlsCertificate.test.ts
          packages/shared/src/fleetTlsProxy.test.ts
          apps/server/src/lan/LanFleet.test.ts
          apps/server/src/auth/RpcAuthorization.test.ts
          apps/server/src/ws.test.ts
          apps/desktop/src/app/DesktopDistribution.test.ts
          apps/server/src/lan/nativeBootstrap.test.ts
          packages/client-runtime/src/connection/onboarding.test.ts
          packages/client-runtime/src/connection/resolver.test.ts
          packages/client-runtime/src/connection/routes.test.ts
          packages/client-runtime/src/connection/registry.test.ts
          packages/client-runtime/src/state/commandPermissions.test.ts
          apps/web/src/connection/lanFleetPolling.test.ts
